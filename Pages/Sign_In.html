<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SignSpeak - Sign In</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: #ffffff;
            color: #1f2328;
        }

        .login-container {
            width: 380px;
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #5b616e;
            font-size: 14px;
        }

        .login-box {
            border: 1px solid #e2e2e6;
            border-radius: 10px;
            padding: 30px;
        }

        .login-box h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .login-box .subtitle {
            color: #5b616e;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-input {
            margin-bottom: 18px;
        }

        .form-input label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-input input {
            display: block;
            width: 100%;
            height: 42px;
            padding: 10px 12px;

            border: 1px solid #d1d5db;
            border-radius: 6px;

            font-size: 14px;
            outline: none;
        }

        .form-input input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            height: 42px;

            margin-top: 5px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 6px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;

            font-size: 14px;
            color: #5b616e;
        }

        .signup-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>

    <div class="login-container">

        <div class="heading">

            <h1>SignSpeak</h1>

            <p>Real Time Hand Sign Detection</p>

        </div>


        <div class="login-box">

            <h2>Sign In</h2>

            <p class="subtitle">
                Sign in to your existing account
            </p>


            <form method="POST" action="/sign-in">

                <div class="form-input">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-input">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    class="login-btn"
                    type="submit">
                    Sign In
                </button>

            </form>


            <div class="signup-link">

                Don't have an account?

                <a href="/login">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</body>

</html>
