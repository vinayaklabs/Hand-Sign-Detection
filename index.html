<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SignSpeak - Real Time Hand Sign Detection</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }
 
    body {
        background: #ffffff;
        color: #1f2328;
        min-height: 100vh;
    }
 
    header {
        display: flex;
        align-items: center;
        padding: 25px 40px;
        border-bottom: 1px solid #e2e2e6;
    }

    .header-title {
        text-align: left;
    }

    header h1 {
        font-size: 28px;
        margin-bottom: 5px;
    }

    header p {
        font-size: 14px;
        color: #5b616e;
    }

    .nav-buttons {
        margin-left: auto;
        display: flex;
        gap: 39px;
    }

    .btn:hover {
        background: #00BFA5;
    }

    .auth-buttons {
        display: flex;
        gap: 8px;
        margin-left: 67px;
    }

    .auth-buttons:hover {
        background: #00BFA5;
    }

    .main {
        display: flex;
        gap: 25px;
        padding: 30px 40px;
        flex-wrap: wrap;
    }
 
    /* LEFT: camera */
 
    .camera-section {
        flex: 2;
        min-width: 320px;
        display: flex;
        flex-direction: column;
    }
 
    .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
    }
 
    button {
        padding: 10px 20px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
 
    #openBtn {
        background: #2563eb;
        color: white;
    }
 
    #openBtn:hover {
        background: #1d4ed8;
    }
 
    #closeBtn {
        background: #e2e2e6;
        color: #1f2328;
    }
 
    #closeBtn:hover {
        background: #cfcfd6;
    }
 
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
 
    .video-box {
        flex: 1;
        min-height: 400px;
        border: 1px solid #e2e2e6;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
    }
 
    .video-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
    }
 
    .video-placeholder {
        color: #ffffff;
        font-size: 16px;
        text-align: center;
        padding: 20px;
    }
 
    /* RIGHT: meaning */
 
    .meaning-section {
        flex: 1;
        min-width: 260px;
        display: flex;
        flex-direction: column;
    }
 
    .meaning-section h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #5b616e;
        margin-bottom: 15px;
    }
 
    #meaning {
        flex: 1;
        min-height: 400px;
        width: 100%;
        border: 1px solid #e2e2e6;
        border-radius: 10px;
        padding: 18px;
        font-size: 22px;
        font-weight: bold;
        color: #2563eb;
        font-family: Arial, sans-serif;
        resize: none;
        outline: none;
        background: #fafafa;
    }
 
    @media (max-width: 800px) {
        .main {
            flex-direction: column;
        }
    }
</style>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

    <button class="theme-toggle" type="button" aria-label="Switch theme">&#9789;</button>

    <header>
        <div>
            <img width="120px" height="70px" src="img/logo.png" alt="logo">
        </div>
        <div class="header-title">
            <h1>SignSpeak</h1>
            <p>Real Time Hand Sign Detection</p>
        </div>

        <div class="nav-buttons">
            <button class="btn" onclick="window.location.href='/'">HOME</button>
            <button class="btn" onclick="window.location.href='/about'">ABOUT</button>
            <button class="btn" onclick="window.location.href='/contact-us'">CONTACT US</button>
        </div>

        <div class="auth-buttons">
            <button class="btn" onclick="window.location.href='/sign-in'">SIGN IN</button>
            <button class="btn" onclick="window.location.href='/login'">LOGIN</button>
        </div>
        
    </header>

    <div class="main">

        <div class="camera-section">
            <div class="controls">
                <button id="openBtn">Open Camera</button>
                <button id="closeBtn" disabled>Close Camera</button>
            </div>
 
            <div class="video-box">
                <img id="cameraFeed" alt="Camera feed">
                <div class="video-placeholder" id="placeholderText">Camera is off</div>
            </div>
        </div>

        <div class="meaning-section">
            <h2>Detected Sign</h2>
            <textarea id="meaning" readonly>No hand detected</textarea>
        </div>
 
    </div>
 
    <script>
        const openBtn = document.getElementById("openBtn");
        const closeBtn = document.getElementById("closeBtn");
        const cameraFeed = document.getElementById("cameraFeed");
        const placeholderText = document.getElementById("placeholderText");
        const meaningBox = document.getElementById("meaning");
 
        let pollTimer = null;
        let permissionAsked = false;
 
        function pollSign() {
            pollTimer = setInterval(() => {
                fetch("/get_sign")
                    .then(res => res.json())
                    .then(data => {
                        meaningBox.value = data.sign;
                    })
                    .catch(err => console.error("Error fetching sign:", err));
            }, 500);
        }
 
        function stopPolling() {
            if (pollTimer) {
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }
 
        async function requestCameraPermission() {
            // Ask the browser for camera permission the first time only.
            // We don't actually use this stream - the video comes from the
            // Flask/OpenCV backend - this just triggers the native prompt.
            if (permissionAsked) return true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
                permissionAsked = true;
                return true;
            } catch (err) {
                alert("Camera permission is required to use SignSpeak.");
                return false;
            }
        }
 
        openBtn.addEventListener("click", async () => {
            const granted = await requestCameraPermission();
            if (!granted) return;
 
            openBtn.disabled = true;
            closeBtn.disabled = false;
 
            await fetch("/start_camera", { method: "POST" });
 
            cameraFeed.src = "/video_feed?t=" + Date.now();
            cameraFeed.style.display = "block";
            placeholderText.style.display = "none";
 
            pollSign();
        });
 
        closeBtn.addEventListener("click", async () => {
            openBtn.disabled = false;
            closeBtn.disabled = true;

            await fetch("/stop_camera", { method: "POST" });

            cameraFeed.src = "";
            cameraFeed.style.display = "none";
            placeholderText.style.display = "block";

            stopPolling();
            meaningBox.value = "No hand detected";
        });
    </script>
    <script src="/static/theme.js"></script>

</body>
</html>
